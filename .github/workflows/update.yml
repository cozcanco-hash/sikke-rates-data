name: Preserve published reference rates
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rate-backup
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/update.mjs
      - name: Preserve validated public data
        run: |
          git config user.name 'Sikke rate backup'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/last-good.json
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve latest published reference table'
            git push
          fi
